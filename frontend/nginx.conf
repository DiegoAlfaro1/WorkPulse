# Throttles password guessing: 10 logins a minute per client IP, bursts of 5, then 429.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy (TLS) sits in front: take the client IP from its X-Forwarded-For, or every user shares one login bucket.
    # Only private-network peers are trusted; nginx itself isn't published to the host.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    server_tokens off;
    # The token lives in localStorage, so XSS = account takeover; CSP keeps React's escaping the only way in.
    # Google Fonts: modernist.css imports Archivo. 'unsafe-inline' styles: React style={} props.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Same-origin API: the browser never talks to the backend directly, so no CORS.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same bucket as login: a stolen token could otherwise brute-force the current password here.
    location = /api/auth/password {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
