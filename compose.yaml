services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    # `docker compose up --watch`: rebuilds and replaces the container on changes (.dockerignore'd paths skipped).
    develop:
      watch:
        - action: rebuild
          path: ./frontend
  backend:
    build: ./backend
    # Creates the super admin on first start (ignored once one exists). Put them in a .env file next to this one.
    environment:
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    # Not published: reached only through the frontend's nginx at /api.
    volumes:
      - data:/data
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./backend

volumes:
  data:
