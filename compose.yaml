services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    # `docker compose up --watch`: rebuilds and replaces the container on changes (.dockerignore'd paths skipped).
    develop:
      watch:
        - action: rebuild
          path: ./frontend
  backend:
    build: ./backend
    # Not published: reached only through the frontend's nginx at /api.
    volumes:
      - data:/data
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./backend

volumes:
  data:
